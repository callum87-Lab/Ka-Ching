# Every commit in a pull request must carry a "Signed-off-by:" line
# (git commit -s), confirming the author has the right to contribute it
# under the project's licence. See CONTRIBUTING.md.
name: Sign-off

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    # Dependabot's automatic dependency updates can't add a sign-off line;
    # they're exempt (the pull request author can't be faked).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $c is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
