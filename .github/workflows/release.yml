# When a version tag (v3.2.0 etc.) is pushed: build the source archive,
# write a SHA256SUMS file of its checksum, sign both with GitHub artifact
# attestations, and attach them to the GitHub release for that tag.
name: Release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="Ka-Ching-${TAG}/" -o "Ka-Ching-${TAG}.tar.gz" HEAD
          sha256sum "Ka-Ching-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Sign them (GitHub artifact attestation)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            Ka-Ching-*.tar.gz
            SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "See CHANGELOG.md"
          gh release upload "$TAG" "Ka-Ching-${TAG}.tar.gz" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
