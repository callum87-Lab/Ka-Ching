# When a version tag (v3.2.0 etc.) is pushed: build the source archive and a
# software bill of materials (SBOM), write a checksums file for both, sign all
# three with GitHub artifact attestations, and attach them to the GitHub
# release for that tag. Every file carries the version in its name.
name: Release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the source archive, the SBOM and the checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="Ka-Ching-${TAG}/" -o "Ka-Ching-${TAG}.tar.gz" HEAD
          # Software bill of materials (CycloneDX): every package the release
          # installs, including sub-dependencies, at its exact version
          python -m venv /tmp/release-env
          /tmp/release-env/bin/pip install --quiet -r requirements.txt
          pip install --quiet cyclonedx-bom==7.5.0
          cyclonedx-py environment /tmp/release-env/bin/python --of JSON -o "Ka-Ching-${TAG}-sbom.cdx.json"
          sha256sum "Ka-Ching-${TAG}.tar.gz" "Ka-Ching-${TAG}-sbom.cdx.json" > "Ka-Ching-${TAG}-SHA256SUMS"
          cat "Ka-Ching-${TAG}-SHA256SUMS"
      - name: Sign them (GitHub artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Ka-Ching-*.tar.gz
            Ka-Ching-*-sbom.cdx.json
            Ka-Ching-*-SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "See CHANGELOG.md"
          gh release upload "$TAG" "Ka-Ching-${TAG}.tar.gz" "Ka-Ching-${TAG}-sbom.cdx.json" "Ka-Ching-${TAG}-SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber
