{#- The K! mark. Colours come from the theme: the K is --kc-mark, the
    sweep of the leg fades into the accent, and the dot is the accent. -#}
{% macro kc_mark(id, width=44, height=33) -%}
<svg class="kc-mark" viewBox="0 0 132 100" width="{{ width }}" height="{{ height }}" role="img" aria-label="Ka-Ching!">
  <defs><linearGradient id="kc-leg-{{ id }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--kc-mark)"/><stop offset="1" style="stop-color: var(--neon-blue)"/></linearGradient></defs>
  <rect x="0" y="0" width="27" height="100" rx="1.5" style="fill: var(--kc-mark)"/>
  <path d="M27 50 L62 0 L92 0 L52 55 L27 70 Z" style="fill: var(--kc-mark)"/>
  <path d="M27 50 C52 48 64 60 73 76 C80 89 88 98 103 100 L61 100 C55 90 50 80 44 73 C38 67 33 66 27 66 Z" fill="url(#kc-leg-{{ id }})"/>
  <path d="M104 0 L129 0 L122 70 L111 70 Z" style="fill: var(--kc-mark)"/>
  <circle cx="116.5" cy="88" r="11.5" style="fill: var(--neon-blue)"/>
</svg>
{%- endmacro %}
