{% extends "base.html" %}
{% block title %}Ka-Ching! &middot; Something went wrong{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ heading }}</h1></div>
<div class="grid">
  <div class="card" style="grid-column: span 12;">
    <p style="margin:0 0 16px; color: var(--text-muted);">{{ message }}</p>
    <a href="{{ back }}" class="btn-secondary">&larr; Go back</a>
  </div>
</div>
{% endblock %}
