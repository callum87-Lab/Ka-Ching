<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Ka-Ching!{% endblock %}</title>
<link rel="icon" type="image/png" href="/static/img/logo.png?v={{ app_version }}">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2fd8ff">
<link rel="apple-touch-icon" href="/static/img/icon-192.png?v={{ app_version }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ka-Ching!">
<link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
</head>
<body>
<div class="frame">
  <header class="topbar">
    <a class="wordmark" href="/">
      <img src="/static/img/logo.png?v={{ app_version }}" alt="Ka-Ching!" class="wordmark-logo">
    </a>
    <nav class="topnav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
      <a href="/calendar" class="{{ 'active' if request.url.path == '/calendar' else '' }}">Calendar</a>
      <a href="/items/new" class="{{ 'active' if request.url.path == '/items/new' else '' }}">Log Orders</a>
      <a href="/search" class="{{ 'active' if request.url.path == '/search' else '' }}">Search</a>
      <a href="/insights" class="{{ 'active' if request.url.path == '/insights' else '' }}">Insights</a>
      <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">Settings</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <span>Ka-Ching! v{{ app_version }} &middot; tracks what's due, not what you own</span>
  </footer>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(function () {});
}

(function () {
  const toolbar = document.getElementById('bulk-toolbar');
  if (!toolbar) return;
  const countSpan = document.getElementById('bulk-count');
  const actionInput = document.getElementById('bulk-action-input');
  const bulkForm = document.getElementById('bulk-form');

  function updateToolbar() {
    const checked = document.querySelectorAll('.bulk-select:checked');
    if (checked.length > 0) {
      toolbar.classList.add('visible');
      countSpan.textContent = checked.length + ' selected';
    } else {
      toolbar.classList.remove('visible');
    }
  }

  document.addEventListener('change', function (e) {
    if (e.target.classList.contains('bulk-select')) {
      updateToolbar();
    }
  });

  window.submitBulk = function (action) {
    const checked = document.querySelectorAll('.bulk-select:checked');
    if (checked.length === 0) return;
    if (action === 'remove' && !confirm('Remove ' + checked.length + ' item(s) permanently? This cannot be undone.')) return;
    actionInput.value = action;
    bulkForm.submit();
  };
})();

document.querySelectorAll('.item-actions-group').forEach(function (grp) {
  var toggle = grp.querySelector('.actions-drawer-toggle');
  if (!toggle) return;
  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    grp.classList.toggle('drawer-open');
  });
});

document.querySelectorAll('.cal-accordion-toggle').forEach(function (head) {
  head.addEventListener('click', function () {
    var body = document.getElementById(head.getAttribute('data-target'));
    if (!body) return;
    var collapsed = body.classList.toggle('collapsed');
    var arrow = head.querySelector('.cal-accordion-arrow');
    if (arrow) arrow.innerHTML = collapsed ? '&#9656;' : '&#9662;';
  });
});
</script>
</body>
</html>
