<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Ka-Ching!{% endblock %}</title>
<link rel="icon" type="image/png" href="/static/img/logo.png?v={{ app_version }}">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2fd8ff">
<link rel="apple-touch-icon" href="/static/img/icon-192.png?v={{ app_version }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ka-Ching!">
<link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
</head>
<body>
<div class="frame">
  <header class="topbar">
    <a class="wordmark" href="/">
      <img src="/static/img/logo.png?v={{ app_version }}" alt="Ka-Ching!" class="wordmark-logo">
    </a>
    <nav class="topnav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Dashboard</a>
      <a href="/calendar" class="{{ 'active' if request.url.path == '/calendar' else '' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar</a>
      <a href="/items/new" class="{{ 'active' if request.url.path == '/items/new' else '' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/></svg>Log Orders</a>
      <a href="/search" class="{{ 'active' if request.url.path == '/search' else '' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search</a>
      <a href="/insights" class="{{ 'active' if request.url.path == '/insights' else '' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>Insights</a>
      <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <span>Ka-Ching! v{{ app_version }} &middot; tracks what's due, not what you own</span>
  </footer>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(function () {});
}

(function () {
  const toolbar = document.getElementById('bulk-toolbar');
  if (!toolbar) return;
  const countSpan = document.getElementById('bulk-count');
  const actionInput = document.getElementById('bulk-action-input');
  const bulkForm = document.getElementById('bulk-form');

  function updateToolbar() {
    const checked = document.querySelectorAll('.bulk-select:checked');
    if (checked.length > 0) {
      toolbar.classList.add('visible');
      countSpan.textContent = checked.length + ' selected';
    } else {
      toolbar.classList.remove('visible');
    }
  }

  document.addEventListener('change', function (e) {
    if (e.target.classList.contains('bulk-select')) {
      updateToolbar();
    }
  });

  window.submitBulk = function (action) {
    const checked = document.querySelectorAll('.bulk-select:checked');
    if (checked.length === 0) return;
    if (action === 'remove' && !confirm('Remove ' + checked.length + ' item(s) permanently? This cannot be undone.')) return;
    actionInput.value = action;
    bulkForm.submit();
  };
})();

document.querySelectorAll('.item-actions-group').forEach(function (grp) {
  var toggle = grp.querySelector('.actions-drawer-toggle');
  if (!toggle) return;
  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var wasOpen = grp.classList.contains('drawer-open');
    document.querySelectorAll('.item-actions-group.drawer-open').forEach(function (g) {
      g.classList.remove('drawer-open');
    });
    if (!wasOpen) grp.classList.add('drawer-open');
  });
});

document.addEventListener('click', function (e) {
  if (e.target.closest('.item-actions-group')) return;
  document.querySelectorAll('.item-actions-group.drawer-open').forEach(function (g) {
    g.classList.remove('drawer-open');
  });
});

(function () {
  var STORAGE_KEY = 'kaching-accordion-overrides';
  var overrides = {};
  try {
    overrides = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch (e) {
    overrides = {};
  }

  document.querySelectorAll('.cal-accordion-toggle').forEach(function (head) {
    var target = head.getAttribute('data-target');
    var body = document.getElementById(target);
    if (!body) return;
    // Apply any remembered override from a previous visit, regardless of
    // which way the server rendered it by default.
    if (Object.prototype.hasOwnProperty.call(overrides, target)) {
      var shouldCollapse = overrides[target];
      body.classList.toggle('collapsed', shouldCollapse);
      var arrowInit = head.querySelector('.cal-accordion-arrow');
      if (arrowInit) arrowInit.innerHTML = shouldCollapse ? '&#9656;' : '&#9662;';
    }

    head.addEventListener('click', function () {
      var collapsed = body.classList.toggle('collapsed');
      var arrow = head.querySelector('.cal-accordion-arrow');
      if (arrow) arrow.innerHTML = collapsed ? '&#9656;' : '&#9662;';
      overrides[target] = collapsed;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
      } catch (e) {
        // Storage full or unavailable - the toggle still works for this
        // visit, it just won't be remembered next time.
      }
    });
  });
})();

document.querySelectorAll('.track-link-btn').forEach(function (link) {
  link.addEventListener('click', function () {
    var tracking = link.getAttribute('data-tracking');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(tracking);
    }
    // Deliberately not calling preventDefault() - the link still opens
    // PostTrack in a new tab as normal, this just also puts the number
    // on the clipboard first so it's ready to paste (and PostTrack
    // itself picks it straight up from there automatically).
  });
});
document.querySelectorAll('.sync-key-copy-btn').forEach(function (field) {
  field.addEventListener('click', function () {
    field.select();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(field.getAttribute('data-key'));
    }
    var wrap = field.closest('.sync-key-wrap');
    if (wrap) {
      wrap.classList.add('copied');
      setTimeout(function () { wrap.classList.remove('copied'); }, 1500);
    }
  });
});
</script>
</body>
</html>
